name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

# Отменяет предыдущие runs для того же branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy values for CI (tests don't require real secrets)
  SESSION_SECRET: "ci-test-session-secret-32chars!!"
  NEXT_PUBLIC_BUILD_TIME: "2024-01-01T00:00:00Z"

jobs:
  # --------------------------------------------
  # Job 1: Fast checks (fail fast)
  # --------------------------------------------
  fast-checks:
    name: Fast Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check for merge conflicts
        run: npm run check:conflicts

      - name: Check migrations
        run: npm run db:migrations:check

      - name: Scan for secrets
        run: npm run security:secrets

      - name: Security scan (SAST-lite)
        run: npm run security:scan

  # --------------------------------------------
  # Job 2: Quality checks
  # --------------------------------------------
  quality:
    name: Lint, Typecheck, Tests
    runs-on: ubuntu-latest
    needs: fast-checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint -- --quiet

      - name: Run typecheck
        run: npm run typecheck -- --pretty false

      - name: Run unit tests
        run: npm run test

  # --------------------------------------------
  # Job 3: Build & Bundle check
  # --------------------------------------------
  build:
    name: Build & Performance
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Кэшируем ТОЛЬКО .next/cache, не весь .next
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-cache-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Remove stale Next lock (if any)
        run: rm -f .next/lock || true

      - name: Build application
        run: npm run build

      - name: Check bundle size (perf budget)
        run: npm run perf:budget
        continue-on-error: false

  # --------------------------------------------
  # Job 4: Dependency audit
  # --------------------------------------------
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (production)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true # Don't block on audit, but report

  # --------------------------------------------
  # Job 5: E2E Smoke tests
  # --------------------------------------------
  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-cache-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Next.js server
        run: |
          npm start > /tmp/nextjs.log 2>&1 &
          echo $! > /tmp/nextjs.pid
        env:
          PORT: 3000
          NODE_ENV: production
          ENABLE_QA: "true"

      - name: Wait for server to be ready
        run: npx wait-on http://127.0.0.1:3000/login --timeout 60000

      - name: Run smoke routes test
        run: npx playwright test tests/e2e/smoke.routes.spec.ts --reporter=line
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          NODE_ENV: development
          ENABLE_QA: "true"
          CI: "true"

      - name: Run basic smoke tests
        run: npx playwright test tests/e2e/smoke.spec.ts --reporter=line
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          TEST_ACCESS_CODE: ${{ secrets.TEST_ACCESS_CODE }}
          TEST_ADMIN_CODE: ${{ secrets.TEST_ADMIN_CODE }}
          AUTH_USER_CHAIRMAN: ${{ secrets.AUTH_USER_CHAIRMAN }}
          AUTH_PASS_CHAIRMAN: ${{ secrets.AUTH_PASS_CHAIRMAN }}
          AUTH_USER_SECRETARY: ${{ secrets.AUTH_USER_SECRETARY }}
          AUTH_PASS_SECRETARY: ${{ secrets.AUTH_PASS_SECRETARY }}
          AUTH_USER_ACCOUNTANT: ${{ secrets.AUTH_USER_ACCOUNTANT }}
          AUTH_PASS_ACCOUNTANT: ${{ secrets.AUTH_PASS_ACCOUNTANT }}
          CI: "true"

      - name: Stop Next.js server
        if: always()
        run: |
          if [ -f /tmp/nextjs.pid ]; then
            kill $(cat /tmp/nextjs.pid) || true
            rm /tmp/nextjs.pid
          fi
          pkill -f "next start" || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-logs
          path: /tmp/nextjs.log
          retention-days: 7
