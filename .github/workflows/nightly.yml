name: Nightly E2E

on:
  schedule:
    # Runs at 3:00 AM UTC every day
    - cron: "0 3 * * *"
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: nightly-e2e
  cancel-in-progress: true

env:
  SESSION_SECRET: "ci-test-session-secret-32chars!!"
  NEXT_PUBLIC_BUILD_TIME: "2024-01-01T00:00:00Z"

jobs:
  # Full E2E test suite (nightly)
  full-e2e:
    name: Full E2E Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: nextjs-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-cache-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Next.js server
        run: |
          npm start > /tmp/nextjs.log 2>&1 &
          echo $! > /tmp/nextjs.pid
        env:
          PORT: 3000
          NODE_ENV: production
          ENABLE_QA: "true"

      - name: Wait for server to be ready
        run: npx wait-on http://127.0.0.1:3000/login --timeout 120000

      # Run all E2E tests
      - name: Run Access Matrix tests
        run: npm run test:matrix
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          TEST_ACCESS_CODE: ${{ secrets.TEST_ACCESS_CODE }}
          TEST_ADMIN_CODE: ${{ secrets.TEST_ADMIN_CODE }}
          AUTH_USER_CHAIRMAN: ${{ secrets.AUTH_USER_CHAIRMAN }}
          AUTH_PASS_CHAIRMAN: ${{ secrets.AUTH_PASS_CHAIRMAN }}
          AUTH_USER_SECRETARY: ${{ secrets.AUTH_USER_SECRETARY }}
          AUTH_PASS_SECRETARY: ${{ secrets.AUTH_PASS_SECRETARY }}
          AUTH_USER_ACCOUNTANT: ${{ secrets.AUTH_USER_ACCOUNTANT }}
          AUTH_PASS_ACCOUNTANT: ${{ secrets.AUTH_PASS_ACCOUNTANT }}
          CI: "true"

      - name: Run smoke routes tests
        run: npx playwright test tests/e2e/smoke.routes.spec.ts --reporter=html
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          ENABLE_QA: "true"
          CI: "true"

      - name: Run smoke tests
        run: npx playwright test tests/e2e/smoke.spec.ts --reporter=html
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          TEST_ACCESS_CODE: ${{ secrets.TEST_ACCESS_CODE }}
          TEST_ADMIN_CODE: ${{ secrets.TEST_ADMIN_CODE }}
          AUTH_USER_CHAIRMAN: ${{ secrets.AUTH_USER_CHAIRMAN }}
          AUTH_PASS_CHAIRMAN: ${{ secrets.AUTH_PASS_CHAIRMAN }}
          AUTH_USER_SECRETARY: ${{ secrets.AUTH_USER_SECRETARY }}
          AUTH_PASS_SECRETARY: ${{ secrets.AUTH_PASS_SECRETARY }}
          AUTH_USER_ACCOUNTANT: ${{ secrets.AUTH_USER_ACCOUNTANT }}
          AUTH_PASS_ACCOUNTANT: ${{ secrets.AUTH_PASS_ACCOUNTANT }}
          CI: "true"

      - name: Run Office smoke tests
        run: npx playwright test tests/e2e/office-smoke.spec.ts --reporter=html
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          AUTH_USER_CHAIRMAN: ${{ secrets.AUTH_USER_CHAIRMAN }}
          AUTH_PASS_CHAIRMAN: ${{ secrets.AUTH_PASS_CHAIRMAN }}
          AUTH_USER_SECRETARY: ${{ secrets.AUTH_USER_SECRETARY }}
          AUTH_PASS_SECRETARY: ${{ secrets.AUTH_PASS_SECRETARY }}
          AUTH_USER_ACCOUNTANT: ${{ secrets.AUTH_USER_ACCOUNTANT }}
          AUTH_PASS_ACCOUNTANT: ${{ secrets.AUTH_PASS_ACCOUNTANT }}
          AUTH_USER_ADMIN: ${{ secrets.AUTH_USER_ADMIN }}
          AUTH_PASS_ADMIN: ${{ secrets.AUTH_PASS_ADMIN }}
          ENABLE_QA: "true"
          CI: "true"

      - name: Run regression tests
        run: npx playwright test tests/e2e/regression.access.spec.ts tests/e2e/regression.admin-flow.spec.ts --reporter=html
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          TEST_ACCESS_CODE: ${{ secrets.TEST_ACCESS_CODE }}
          TEST_ADMIN_CODE: ${{ secrets.TEST_ADMIN_CODE }}
          AUTH_USER_CHAIRMAN: ${{ secrets.AUTH_USER_CHAIRMAN }}
          AUTH_PASS_CHAIRMAN: ${{ secrets.AUTH_PASS_CHAIRMAN }}
          CI: "true"

      - name: Stop Next.js server
        if: always()
        run: |
          if [ -f /tmp/nextjs.pid ]; then
            kill $(cat /tmp/nextjs.pid) || true
            rm /tmp/nextjs.pid
          fi
          pkill -f "next start" || true

      # Save artifacts
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 14

      - name: Upload Next.js logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextjs-logs-${{ github.run_number }}
          path: /tmp/nextjs.log
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ github.run_number }}
          path: test-results/
          retention-days: 14
